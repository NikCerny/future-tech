<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Tech | Contacts</title>

    <link rel="stylesheet" href="./styles/main.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.2/build/css/intlTelInput.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.2/build/js/intlTelInput.min.js"></script>
    <script src="./scripts/main.js" type="module"></script>
  </head>
  <header class="header" data-js-header>
    <div class="header__body container">
      <a href="#" class="header__logo logo" aria-label="Home" title="Home"
        ><img
          src="./images/logo.svg"
          alt="FutureTech logo"
          class="logo__image"
          width="179"
          height="50"
      /></a>
      <div class="header__overlay" data-js-header-overlay>
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a href="./index.html" class="header__menu-link">Home</a>
            </li>
            <li class="header__menu-item">
              <a href="./news.html" class="header__menu-link">News</a>
            </li>

            <li class="header__menu-item">
              <a href="./podcasts.html" class="header__menu-link">Podcasts</a>
            </li>
            <li class="header__menu-item">
              <a href="./resources.html" class="header__menu-link">Resources</a>
            </li>
          </ul>
        </nav>
        <a href="./contacts.html" class="header__button button button--accent">
          Contact Us
        </a>
      </div>

      <button
        class="header__burger-button burger-button visible-mobile extended-click-area"
        type="button"
        aria-label="Open navigation menu"
        title="Open navigation menu"
        data-js-header-burger-button
      >
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
      </button>
    </div>
  </header>
  <body>
    <div class="container">
      <div class="select field" data-js-select>
        <label for="phoneNumberPrefix" class="select__label" id="select-label"
          >Phone number prefix</label
        ><select
          id="phoneNumberPrefix"
          class="select__control field__control"
          tabindex="-1"
          data-js-select-control
        >
          <option value="+7" selected>+7</option>
          <option value="+1">+1</option>
          <option value="+2">+2</option>
          <option value="+3">+3</option>
        </select>
        <div class="select__body">
          <div
            class="select__button field__control"
            tabindex="0"
            role="combobox"
            aria-expanded="false"
            aria-haspopup="listbox"
            aria-controls="select-dropdown"
            aria-labelledby="select-label"
            data-js-select-button
          >
            +7
          </div>
          <div
            class="select__dropdown is-left-sided"
            role="listbox"
            id="select-dropdown"
            aria-labelledby="select-label"
            data-js-select-dropdown
          >
            <div
              class="select__option is-selected is-current"
              role="option"
              aria-selected="true"
              id="select-option-1"
              data-js-select-option
            >
              +7
            </div>
            <div
              class="select__option"
              role="option"
              aria-selected="false"
              id="select-option-2"
              data-js-select-option
            >
              +1
            </div>
            <div
              class="select__option"
              role="option"
              aria-selected="false"
              id="select-option-3"
              data-js-select-option
            >
              +2
            </div>
            <div
              class="select__option"
              role="option"
              aria-selected="false"
              id="select-option-4"
              data-js-select-option
            >
              +3
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
