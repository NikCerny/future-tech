<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Tech | Contacts</title>
    <link rel="stylesheet" href="./styles/main.css" />

    <script src="./scripts/main.js" type="module"></script>
  </head>
  <body>
    <div class="select-tmp field" data-js-select-tmp>
      <label
        for="phoneNumberPrefix"
        class="select__label visually-hidden"
        id="select-label"
        >Phone number prefix</label
      >

      <div class="select-tmp__custom">
        <div
          class="select-tmp__button field__control"
          tabindex="0"
          data-js-select-button
          role="combobox"
          aria-haspopup="listbox"
          aria-controls="select-dropdown"
          aria-expanded="false"
          aria-labelledby="select-label"
        ></div>
        <div
          class="select-tmp__dropdown"
          data-js-select-dropdown
          id="select-dropdown"
          role="listbox"
          aria-labelledby="select-label"
        >
          <div
            class="select-tmp__option is-selected is-current"
            data-js-select-option
            role="option"
            aria-selected="true"
            id="phone-number-prefix-select-option-1"
          >
            +7
          </div>
          <div
            class="select-tmp__option"
            data-js-select-option
            role="option"
            aria-selected="false"
            id="phone-number-prefix-select-option-2"
          >
            +1
          </div>
          <div
            class="select-tmp__option"
            data-js-select-option
            role="option"
            aria-selected="false"
            id="phone-number-prefix-select-option-3"
          >
            +2
          </div>
          <div
            class="select-tmp__option"
            data-js-select-option
            role="option"
            aria-selected="false"
            id="phone-number-prefix-select-option-4"
          >
            +3
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
