<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Future Tech | Contacts</title>
    <link rel="stylesheet" href="./styles/main.css" />

    <script src="./scripts/main.js" type="module"></script>
  </head>
  <body>
    <div class="container">
      <div class="select-tmp field">
        <label
          for="phoneNumberPrefix"
          class="select__label visually-hidden"
          id="select-label"
          >Phone number prefix</label
        >
        <!-- <select class="select-tmp__default-control" id="phoneNumberPrefix"></select> -->
        <div class="select-tmp__custom">
          <div class="select-tmp__button field__control" tabindex="0"></div>
          <div class="select-tmp__dropdown">
            <div class="select-tmp__option is-selected">+7</div>
            <div class="select-tmp__option">+1</div>
            <div class="select-tmp__option">+2</div>
            <div class="select-tmp__option">+3</div>
          </div>
        </div>
      </div>
    </div>
  </body>
